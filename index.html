<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kgomo's | Premium Family Dining — Pretoria East</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                DEFAULT: '#C4963A',
                light: '#E8C97A',
                pale: '#F5ECD7',
              },
              dark: '#0F0C07',
              charcoal: '#1C1810',
              brown: '#2E2016',
              cream: '#FAF7F2',
              rust: '#8B3A1E',
              green: '#2D5A27',
              text: '#2A1F0E',
              muted: '#7A6A52',
            },
            fontFamily: {
              serif: ['Cormorant Garamond', 'serif'],
              sans: ['DM Sans', 'sans-serif'],
            },
            animation: {
              fadeIn: 'fadeIn 0.8s ease-out forwards',
              slideUp: 'slideUp 0.6s ease-out forwards',
              scaleIn: 'scaleIn 0.4s ease-out forwards',
              bounceIn: 'bounceIn 1s cubic-bezier(0.36, 0, 0.66, -0.56) forwards',
              heroZoom: 'heroZoom 20s ease-in-out infinite alternate',
              float: 'float 6s ease-in-out infinite',
              shimmer: 'shimmer 2s linear infinite',
              shake: 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              bounceIn: {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              heroZoom: {
                'from': { transform: 'scale(1.05)' },
                'to': { transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #FAF7F2;
            color: #2A1F0E;
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1"
  }
}
</script>
<!-- index.css removed as it is missing and Tailwind is handled via CDN -->
</head>
<body class="bg-cream text-dark overflow-x-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
